server {
    listen 80 default_server;
    server_name _;
    return 421;
}
server {
    listen 80;
    server_name health.localhost *.health.localhost;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $health_backend http://backend:8080;
    client_max_body_size 1m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    location /api/ {
        proxy_pass $health_backend;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 30s;
    }
    location /actuator { return 404; }
    location = /demo { return 404; }
    location ^~ /demo/ { return 404; }
    location ~ ^(?<export_route>.*)/(?<export_segment>__next\.\$c\$path)\.__PAGE__\.txt$ {
        default_type text/x-component;
        try_files $export_route/$export_segment/__PAGE__.txt =404;
    }
    location / { try_files $uri $uri/index.html =404; }
}
