name: health-project-qa
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:18025:8025'
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: health_project
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python scripts/health-qa.py prepare}
      MYSQL_ROOT_HOST: '%'
      MYSQL_USER: health_app
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Run python scripts/health-qa.py prepare}
    ports:
      - '127.0.0.1:13307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/01-privileges.sh:/docker-entrypoint-initdb.d/01-privileges.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  migrate:
    image: health-project-backend:qa
    build: ./backend
    command: ['--migrate']
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/health_project?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MIGRATION_USER: root
      MIGRATION_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
  backend:
    image: health-project-backend:qa
    build: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/health_project?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DATABASE_USER: health_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      HEALTH_TRUST_GATEWAY: 'true'
      HEALTH_BASE_DOMAIN: health.localhost
      HEALTH_PUBLIC_ORIGIN: http://health.localhost:18080
      BOOTSTRAP_ADMIN_EMAIL: qa-admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Run python scripts/health-qa.py prepare}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USERNAME: ''
      SMTP_PASSWORD: ''
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      MAIL_FROM: qa-no-reply@example.test
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --header="Host: health.localhost" -O /dev/null http://127.0.0.1:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  gateway:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:18080:80'
    environment:
      HEALTH_BASE_DOMAIN: health.localhost
      NGINX_ENVSUBST_FILTER: HEALTH_BASE_DOMAIN
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ./frontend/out
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql_data:
    name: health-project-qa_mysql_data
