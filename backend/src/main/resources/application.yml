spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: health-project
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/health_project?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DATABASE_USER:health_app}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/health_project?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    user: ${MIGRATION_USER:root}
    password: ${MIGRATION_PASSWORD:}
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
health:
  mail:
    from: ${MAIL_FROM:no-reply@health.localhost}
  base-domain: ${HEALTH_BASE_DOMAIN:health.localhost}
  public-origin: ${HEALTH_PUBLIC_ORIGIN:http://health.localhost:8080}
  session-hours: ${SESSION_HOURS:8}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    org.springframework.security: WARN
